services:
  - type: web
    name: healytics
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_USERNAME
        value: demo
      - key: DEMO_PASSWORD
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./healytics.db
